{% comment %} {% extends "base.html" %} {% endcomment %}
{% load static %}

    <div class="login-container">
        <div class="login-card">
            <h2>Авторизация</h2>

            <form method="post" action="{% url 'login' %}" class="login-form">
                {% csrf_token %}
                 {% if request.GET.next %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% endif %}

                    <div class="form-label">
                        <label for="id_username" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control"
                        value="{% if form.username.value %}{{ form.username.value }}{% endif %}"
                        name="username" id="id_username"
                        placeholder="Введите ваше имя пользователя"
                        required>
                    </div>
                    <div class="form-label">
                        <label for="id_password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" name="password" id="id_password"
                        placeholder="Введите ваш пароль!" required>
                        <i id="eye-icon" class="fa fa-eye-slash" aria-hidden="true"
                               onclick="PasswordVisibility('id_password', 'eye-icon')"
                               style="position: absolute; right: 15px; top: 66%; transform: translateY(-50%);
                               color: #707070; cursor: pointer;">
                        </i>
                    </div>

                {# Вывод общих ошибок формы (например, неверный логин/пароль) #}
                {% if form.non_field_errors %}
                    <div class="form-error">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                <button type="submit" class="login-btn">Войти</button>
            </form>

        </div>
    </div>
